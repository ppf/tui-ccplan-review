# Tmux Integration for TUI Plan Review
# Add this to your ~/.config/tmux/tmux.conf or ~/.tmux.conf

# Keybinding: <leader> + P to open plan review in popup
# Launches the latest plan from ~/.claude/plans/
bind-key P display-popup -E -w 90% -h 90% \
  "ccplan-review-latest"

# Alternative: Use a specific plan file
# bind-key P display-popup -E -w 90% -h 90% \
#   "ccplan-review ~/.claude/plans/my-plan.md"

# Tip: After reviewing, press 's' in the TUI to generate summary
# The summary is copied to clipboard and ready to paste back to Claude
